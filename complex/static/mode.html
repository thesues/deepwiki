<div id="research-mode" class="compose-mode-row">
  <label class="compose-mode" for="research-mode-select" title="发送前选择执行方式；单体开始回复或研究任务开始执行后，该会话方式固定">
    <select id="research-mode-select" aria-label="执行方式">
      <option value="single">单体执行</option>
      <option value="kanban">团队协作</option>
      <option value="swarm">独立群研</option>
    </select>
  </label>
  <span id="research-mode-fixed" class="mode-fixed" hidden aria-live="polite"></span>
</div>
