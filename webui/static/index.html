<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepwiki</title>
<link rel="stylesheet" href="/static/style.css">
<script>
/* Apply the saved theme BEFORE first paint — a light reader must not see a
   dark flash on every navigation. Inline, not app.js: app.js loads at the
   end of the body. */
try { if (localStorage.getItem("hermes.theme") === "light") document.documentElement.dataset.theme = "light"; } catch (_) {}
</script>
</head>
<body>
<div class="shell">
  <header>
    <!-- One way back (首页, where projects are picked) and ONE 新会话, which
         opens a conversation inside the project this page already serves.
         The sidebar used to carry a second ＋ 新会话 at the tail of the
         session list: the same action, two inches away, wearing the shape of
         a list row. The theme toggle sits last, at the far right, the way
         deepwiki places it. -->
    <a id="home-link" class="btn ghost" href="/" title="返回首页 — 重新选择项目或会话">← 首页</a>
    <span class="proj-name" id="proj-name"></span>
    <span class="spacer"></span>
    <button id="new-session" class="btn" title="在这个项目里新建会话">＋ 新会话</button>
    <div class="meta">
      <span id="build" title="本页加载的前端构建号 — 反馈问题时带上它">@@BUILD@@</span>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" title="切换到亮色主题" aria-label="切换主题">
      <!-- Both icons are always in the DOM; [data-theme] picks which is up
           (style.css .theme-toggle), so the switch needs no script at all. -->
      <svg class="t-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.1"/>
        <path d="M12 2.6v2.1M12 19.3v2.1M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/>
      </svg>
      <svg class="t-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.9A8.6 8.6 0 0 1 9.1 3.5a8.6 8.6 0 1 0 11.4 11.4Z"/>
      </svg>
    </button>
  </header>

  <div class="grid">
    <section class="card sessions">
      <div class="card-head"><span class="dot"></span>会话<span class="count" id="sess-count"></span></div>
      <!-- This project's conversations only: the sidebar is scoped to the
           profile the URL names, because a conversation belongs to the
           project it was opened under and a project page shows its own. -->
      <ul id="sessions"></ul>
    </section>

    <section class="card chat">
      <div class="card-head">
        <span class="dot" id="run-dot"></span><span id="spin"></span><span id="run-status">就绪</span>
        <span class="count" id="elapsed"></span>
      </div>
      <div id="messages"></div>
      <form id="composer">
        <!-- The textarea + send sit in one row; the pickers live in a
             SMALL-FONT ROW BELOW the box (deepwiki/Devin style): the project
             on the left, the model that answers on the right. Both are
             properties of THIS conversation, and both are always a select —
             a single entry is information, not noise. -->
        <div class="compose-row">
          <textarea id="input" rows="1" placeholder="发消息…  Enter 发送 · Shift+Enter 换行"></textarea>
          <button id="send" type="submit" class="btn">发送</button>
        </div>
        <div class="picker-row">
          <span id="model-badge" hidden></span>
          <select id="endpoint" hidden title="本会话回复所用的模型"></select>
        </div>
      </form>
    </section>
  </div>

  <!-- The architecture note. Hidden markup rather than a fetched fragment for
       the shell; the prose itself is fetched on first open. -->
  <div id="about" hidden>
    <div class="about-panel">
      <button id="about-close" title="关闭">×</button>
      <div id="about-body" class="md"></div>
    </div>
  </div>
</div>

<!-- marked renders the model's markdown; DOMPurify sanitises what it produces.
     Both are vendored, not CDN-loaded: this pod has no egress to the internet. -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
