<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepwiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <header>
    <!-- One door, not two buttons: the home page is where sessions are
         chosen and projects are picked, so the only permanent control here
         is the way back to it. 新会话 lives there too — a new conversation
         is a property of a project, and the project is chosen on the home
         page. -->
    <a id="home-link" class="btn ghost" href="/" title="返回首页 — 重新选择项目或会话">← 首页</a>
    <span class="proj-name" id="proj-name"></span>
    <span class="spacer"></span>
    <div class="meta">
      <span id="build" title="本页加载的前端构建号 — 反馈问题时带上它">@@BUILD@@</span>
    </div>
  </header>

  <div class="grid">
    <section class="card sessions">
      <div class="card-head"><span class="dot"></span>会话<span class="count" id="sess-count"></span></div>
      <!-- This project's conversations only: the sidebar is scoped to the
           profile the URL names, because a conversation belongs to the
           project it was opened under and a project page shows its own. -->
      <ul id="sessions"></ul>
      <a class="new-sess" href="/">＋ 新会话（回首页选项目）</a>
    </section>

    <section class="card chat">
      <div class="card-head">
        <span class="dot" id="run-dot"></span><span id="spin"></span><span id="run-status">就绪</span>
        <span class="count" id="elapsed"></span>
      </div>
      <div id="messages"></div>
      <form id="composer">
        <!-- The textarea + send sit in one row; the pickers live in a
             SMALL-FONT ROW BELOW the box (deepwiki/Devin style): the project
             on the left, the model that answers on the right. Both are
             properties of THIS conversation, and both are always a select —
             a single entry is information, not noise. -->
        <div class="compose-row">
          <textarea id="input" rows="1" placeholder="发消息…  Enter 发送 · Shift+Enter 换行"></textarea>
          <button id="send" type="submit" class="btn">发送</button>
        </div>
        <div class="picker-row">
          <span id="model-badge" hidden></span>
          <select id="endpoint" hidden title="本会话回复所用的模型"></select>
        </div>
      </form>
    </section>
  </div>

  <!-- The architecture note. Hidden markup rather than a fetched fragment for
       the shell; the prose itself is fetched on first open. -->
  <div id="about" hidden>
    <div class="about-panel">
      <button id="about-close" title="关闭">×</button>
      <div id="about-body" class="md"></div>
    </div>
  </div>
</div>

<!-- marked renders the model's markdown; DOMPurify sanitises what it produces.
     Both are vendored, not CDN-loaded: this pod has no egress to the internet. -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
