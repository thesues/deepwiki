# Single-RTX-4090 MiniMax-H3 service. This follows the official vLLM recipe's
# model-level CPU offload path (not DLO). Online FP8 is limited to the DiT so
# the encoder/offloader initialization peak fits in 24 GiB.
# The image digest is the amd64 minimax-h3 image containing the matched
# vLLM 0.26.0 + vLLM-Omni model/minimax-h3 revision (310b4b4); do not overlay
# current vLLM-Omni main, whose dependencies target vLLM 0.30.0.
# Model files stay in Autumn: the server reads
# /mnt/autumn/models/minimax-h3-vllm/FL2VA directly through autumn-fuse with
# direct reads enabled. There is no 140 GB init copy or model cache volume.
# The pod intentionally targets the zone-C 8x4090 host used by ComfyUI but
# requests a separate GPU; it never restarts, scales, or modifies ComfyUI.
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-omni-h3
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: vllm-omni-h3 }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: vllm-omni-h3 }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-omni-h3
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: vllm-omni-h3 }
spec:
  progressDeadlineSeconds: 3600
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: vllm-omni-h3 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: vllm-omni-h3 }
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: "192.168.3.2"
        topology.kubernetes.io/zone: cn-beijing-c
      initContainers:
        # Copy only the mount executable and its small runtime dependency. The
        # mount itself must run in the vLLM container's namespace; a FUSE
        # sidecar does not propagate mounts on this cluster.
        - name: fusebin
          image: dongmao-test-cn-beijing.cr.volces.com/dongmao-test/autumn-rs:874a0bac1fe455151073598f70af0dc02e69b31e
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /usr/local/bin/autumn-fuse /fusebin/
              cp /usr/bin/fusermount3 /fusebin/
              cp -L /usr/lib/x86_64-linux-gnu/libfuse3.so.3 /fusebin/
              chmod +x /fusebin/autumn-fuse /fusebin/fusermount3
          resources:
            requests: { cpu: "1", memory: 256Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - { name: fusebin, mountPath: /fusebin }
      containers:
        - name: server
          image: docker.m.daocloud.io/vllm/vllm-omni@sha256:511ea7f895f4a19f61247795bd30d6bdd3f545491e09cd9a8e28f4e07babe212
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail

              # privileged exposes every GPU device, so follow the UUID that
              # the device plugin assigned instead of assuming physical GPU 0.
              case "${NVIDIA_VISIBLE_DEVICES:-}" in
                ""|all|void|none) echo "GPU allocation is not specific" >&2; exit 1 ;;
                *) export CUDA_VISIBLE_DEVICES="$NVIDIA_VISIBLE_DEVICES" ;;
              esac

              export PATH="/opt/fusebin:$PATH"
              export LD_LIBRARY_PATH="/opt/fusebin:${LD_LIBRARY_PATH:-}"
              M="$(getent hosts autumn-manager | awk '{print $1}'):9001"
              MP=/mnt/autumn
              MODEL="$MP/models/minimax-h3-vllm/FL2VA"
              mkdir -p "$MP"
              if grep -qs " $MP fuse" /proc/mounts; then
                /opt/fusebin/fusermount3 -uz "$MP" 2>/dev/null || umount -l "$MP" 2>/dev/null || true
              fi
              /opt/fusebin/autumn-fuse \
                --manager "$M" \
                --mountpoint "$MP" \
                --transport tcp \
                --direct-read true \
                --read-io-threads 8 \
                --credential-file /etc/autumn/cred/fs.cred &
              FUSE_PID=$!
              trap 'kill $FUSE_PID 2>/dev/null || true; /opt/fusebin/fusermount3 -uz /mnt/autumn 2>/dev/null || umount -l /mnt/autumn 2>/dev/null || true' EXIT

              # A real 1 MiB shard read proves both FUSE readiness and the
              # direct-read-sized path; a mount-table check can race FUSE INIT.
              PROBE="$MODEL/transformer/model-00001-of-00013.safetensors"
              for i in $(seq 1 120); do
                dd if="$PROBE" of=/dev/null bs=1M count=1 status=none 2>/dev/null && break
                kill -0 "$FUSE_PID" 2>/dev/null || { echo "autumn-fuse exited during mount" >&2; exit 1; }
                sleep 1
              done
              dd if="$PROBE" of=/dev/null bs=1M count=1 status=none
              test -s "$MODEL/model_index.json"
              echo "AutumnFS direct-read model: $MODEL"

              exec vllm serve "$MODEL" \
                --omni \
                --host 0.0.0.0 \
                --port 8000 \
                --trust-remote-code \
                --num-gpus 1 \
                --quantization fp8 \
                --enable-cpu-offload \
                --stage-init-timeout 1800 \
                --init-timeout 1800 \
                --diffusion-attention-backend FLASH_ATTN
          env:
            - { name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn }
            - { name: VLLM_OMNI_VIDEO_SYNC_TIMEOUT, value: "1800" }
            - { name: HF_HUB_OFFLINE, value: "1" }
          ports:
            - { name: http, containerPort: 8000 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "24"
              memory: 390Gi
              nvidia.com/gpu: "1"
              vke.volcengine.com/eni-ip: "1"
            limits:
              cpu: "64"
              memory: 420Gi
              nvidia.com/gpu: "1"
              vke.volcengine.com/eni-ip: "1"
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - { name: mnt, mountPath: /mnt/autumn }
            - { name: fusebin, mountPath: /opt/fusebin }
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
            - { name: dshm, mountPath: /dev/shm }
      terminationGracePeriodSeconds: 120
      volumes:
        - { name: mnt, emptyDir: {} }
        - { name: fusebin, emptyDir: {} }
        - name: cred
          secret: { secretName: autumn-credential }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
