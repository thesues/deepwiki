# hermes webui — session management and a chat box.
#
# Note what is NOT here, compared to every other workload in this repo: no
# privileged container, no `autumn-fuse`, no `/dev/fuse`, no autumn credential,
# no mountPropagation. This pod never talks to autumn. It talks to `lance-mcp`
# over HTTP MCP and to `freetoken-l3` over the OpenAI-compatible API, both plain
# ClusterIP Services.
#
# `IMAGE_WEBUI` below is a PLACEHOLDER, not an image. Substitute it before
# applying — `sed "s|IMAGE_WEBUI|<repo>/deepwiki-webui:<sha>|" k8s/webui.yaml |
# kubectl apply -f -`. A raw `kubectl apply` of this file is accepted and then
# leaves the pod in InvalidImageName with the old one already torn down, which
# is how the webui went down once. The same holds for `IMAGE_FREETOKEN_L3` in
# freetoken-l3.yaml.
#
# The practical consequence is that this image is NOT under autumn's WIRE
# lockstep: rolling the cluster to a new wire version does not require
# rebuilding it. That is what the MCP HTTP transport bought.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-webui-data
  namespace: autumn
spec:
  accessModes: [ReadWriteOnce]
  # Named explicitly: this cluster has NO default StorageClass, so an unset
  # class leaves the claim Pending and the pod unschedulable. ebs-ssd rather
  # than a node-local class because sessions must survive the pod moving.
  storageClassName: ebs-ssd
  # Sessions ARE the feature. On an emptyDir every restart would present an
  # empty sidebar, which reads as data loss whether or not anyone calls it that.
  # 10Gi, not the 5Gi this asked for: `ebs-ssd` provisions ESSD_PL0, whose
  # minimum volume size is above 5 GiB. The claim below it is accepted by the
  # API server and then fails in the CSI driver with `InvalidVolumeSize`, so the
  # PVC sits Pending and the pod with it — the smallest bound volume in this
  # cluster is the 10Gi ftcache. Sessions are small; this is a floor, not a
  # sizing decision.
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the turn state lives in the process and the
  # session DB is a ReadWriteOnce volume, so two replicas cannot both hold it.
  # A surge-first rollout would deadlock on the PVC.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
    spec:
      # k8s injects HERMES_WEBUI_PORT=tcp://... style vars for every Service in
      # the namespace, which collide with plain PORT-shaped config.
      enableServiceLinks: false
      containers:
        - name: webui
          image: IMAGE_WEBUI
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail

              # Point hermes at the local model server. Best-effort on purpose:
              # a chat UI that refuses to start because a config key moved is
              # worse than one that starts and reports the model is unset.
              if [ -n "${LLM_BASE_URL:-}" ]; then
                # `model.provider custom` FIRST, and it is not optional: without
                # it hermes resolves a provider on its own, lands on openrouter,
                # and `session/new` fails with a bare "Internal error" whose only
                # trace is an OPENROUTER_API_KEY warning in the ACP child's
                # stderr. Verified locally against 0.16 and 0.17 alike.
                hermes config set model.provider custom || \
                  echo "WARN: could not set model.provider" >&2
                hermes config set model.base_url "$LLM_BASE_URL" || \
                  echo "WARN: could not set model.base_url" >&2
                hermes config set model.default "${LLM_MODEL:-dsv4-flash}" || true
                # FreeToken has no auth; hermes still wants the key to be set.
                hermes config set model.api_key "${LLM_API_KEY:-none}" || true
                # hermes trims and compresses against this number, and an
                # explicit config value outranks the length it probes off the
                # server -- so it has to stay under FreeToken's real ceiling,
                # which counts prompt AND generation against one budget. Left
                # too high, every long conversation ends in "prompt is too
                # long: N tokens > M maximum" after the prefill is already
                # paid for. The gap below the ceiling is the room a reply gets
                # to be written into.
                hermes config set model.context_length \
                  "${LLM_CONTEXT_LENGTH:-54000}" || true
              fi

              # ATTEMPTS, not retries: hermes loops
              # `while retry_count < max_retries`, so the 3 its config ships
              # means three tries of every API call. One failed context
              # compression measured 723 s of a conversation showing 回复中…
              # — three attempts at the configured 120 s timeout, then
              # hermes' own retry of the whole call. 2 keeps one retry, which
              # is what recovers a transient reset, and halves the worst case.
              #
              # Here rather than in the app: this is the same kind of decision
              # as the model.* lines above, and `hermes config set` already
              # owns that job. It was briefly a Python helper in
              # hermes_config.py, which meant a code change and an image
              # build to move a number that belongs in the manifest.
              hermes config set agent.api_max_retries \
                "${HERMES_API_MAX_RETRIES:-2}" || true

              # And how long ONE compression attempt may take. hermes' setup
              # wizard writes 120 here, and 120 is too short for this engine:
              # a full window is ~35K of prefill plus a summary generated at
              # ~16 tok/s, so ~180 s. Measured — a small compression finished
              # in 115 s (25 messages -> 14) and the next, larger one timed
              # out. 240 gives a healthy compression room to land; with the
              # retry count above, a hopeless one still ends in two attempts
              # instead of six.
              hermes config set auxiliary.compression.timeout \
                "${HERMES_COMPRESSION_TIMEOUT:-240}" || true

              # The skills ship in the IMAGE and are synced into HERMES_HOME
              # at every start, rather than being copied into the PVC once by hand.
              # HERMES_HOME is a PVC, so a hand-copy would survive -- and would
              # then be a version of the skill that no commit describes, which
              # is how the last config drifted.
              #
              # The image is the source of truth: mirror it, do not merge into
              # it. Two things the first version of this got wrong, both of
              # which a reader saw before the code did.
              #
              # It copied by BASENAME, flattening the tree — hermes groups
              # skills by directory, so `research/buddhist-canon-retrieval`
              # landed as a second top-level `buddhist-canon-retrieval` and the
              # agent reported "two skills with the same name in different
              # categories" and had to pick. Copy the WHOLE tree instead.
              #
              # And it only ever ADDED. A skill deleted from the repo stayed in
              # the volume forever, still listed, still loadable — which is how
              # a retired skill keeps being used. Anything under a managed root
              # that the image no longer carries is removed.
              H="${HERMES_HOME:-/opt/data}"
              # A root the image stops shipping ENTIRELY must still be swept:
              # `plugins` went away with the video provider, and skipping a
              # missing source left the retired plugin loadable in the PVC
              # forever -- it took a shell to remove. An absent source is an
              # empty keep-list, not a reason to leave the volume alone.
              for kind in plugins skills; do
                src="/app/hermes/$kind"
                [ -d "$H/$kind" ] || [ -d "$src" ] || continue
                mkdir -p "$H/$kind"
                # remove what the image dropped, then lay the tree down whole
                if [ -d "$src" ]; then
                  (cd "$src" && find . -mindepth 1 -maxdepth 1 -type d -printf '%P\n') > /tmp/.keep.$kind
                else
                  : > /tmp/.keep.$kind
                fi
                for existing in "$H/$kind"/*/; do
                  [ -d "$existing" ] || continue
                  n="$(basename "$existing")"
                  grep -qx "$n" /tmp/.keep.$kind || { rm -rf "$existing"; echo "removed $kind/$n (gone from the image)"; }
                done
                [ -d "$src" ] || { rmdir "$H/$kind" 2>/dev/null; continue; }
                cp -a "$src/." "$H/$kind/"
                echo "installed $kind: $(cd "$src" && find . -name SKILL.md | wc -l) item(s)"
              done

              # hermes' AIAgent refuses any model whose context window is under
              # MINIMUM_CONTEXT_LENGTH = 64_000, a constant in its `agent`
              # package. FreeToken's real ceiling here is 62,080 counting
              # prompt AND generation, so NO value satisfies both that floor
              # and the ceiling: 64000 clears the check and brings straight
              # back the "prompt is too long: N > 62080" failures the 54000
              # above exists to prevent. Lower the floor rather than lie about
              # the window -- the floor is an arbitrary guard, the ceiling is
              # physics.
              #
              # This only appeared with the library path. The ACP subprocess
              # never ran the check, so the same deployment worked until
              # `run_agent.AIAgent` was driven in process.
              MM=$("${HERMES_PY:-/opt/hermes/.venv/bin/python}" -c \
                    'import agent.model_metadata as m; print(m.__file__)' 2>/dev/null)
              if [ -n "$MM" ] && grep -q '^MINIMUM_CONTEXT_LENGTH' "$MM"; then
                sed -i "s/^MINIMUM_CONTEXT_LENGTH = .*/MINIMUM_CONTEXT_LENGTH = ${HERMES_MIN_CONTEXT:-32000}/" "$MM"
                echo "hermes floor: $(grep '^MINIMUM_CONTEXT_LENGTH' "$MM") in $MM"
              else
                echo "WARN: MINIMUM_CONTEXT_LENGTH not found; a short-context model will be refused" >&2
              fi

              # The MCP server is written by the app at startup, not here: it
              # merges into config.yaml idempotently and reports what it did on
              # /api/status, so there is one owner of that block.
              #
              # HERMES' interpreter, not the image's. The app imports
              # `run_agent.AIAgent` and drives it in process — there is no
              # `hermes acp` subprocess any more — and that import only resolves
              # inside hermes' venv. Everything the app itself adds is stdlib,
              # so nothing of ours competes with hermes' dependency tree, which
              # is the reason the session-store bridge used to run in a second
              # interpreter; it is gone with the ACP client.
              exec "${HERMES_PY:-/opt/hermes/.venv/bin/python}" main.py
          env:
            - { name: PORT, value: "8080" }
            - { name: HERMES_HOME, value: /opt/data }
            # Admission is PER ENDPOINT, read from DEEPWIKI_ENDPOINTS below
            # (each entry's maxConcurrent, checked against that endpoint's own
            # live turns). There is no global knob: a global number could only
            # ever be right for one of the models behind the list. The env
            # MAX_CONCURRENT_TURNS that used to sit here named the fallback
            # for a deploy that declares NO endpoints at all — this one always
            # declares them, so the knob was dead weight and is gone.
            # Every endpoint the picker offers, first one the default. The
            # limit is per entry because the ceiling is the MODEL behind it: a
            # global number could only ever be right for one of them. Adding a
            # provider is a line here — the webui's
            # header picker reads this list from /api/status, and the agent
            # cache signature carries base_url and provider, so a session that
            # switches misses the cache and is rebuilt against the new one,
            # with no separate switch-model path to keep correct.
            #
            # `provider` and `api_key` are optional (custom / none by default);
            # a keyed cloud endpoint is the same shape with its own values:
            #   {"key":"cloud","label":"DeepSeek","model":"deepseek-chat",
            #    "base_url":"https://api.deepseek.com/v1",
            #    "provider":"custom","api_key":"sk-...","maxConcurrent":4}
            #
            # A key belongs in a Secret, not in this file, so `api_key_env`
            # names the variable to read instead of carrying the value —
            # `ARK_API_KEY` below arrives from `hermes-webui-llm`. Declaring
            # a key inline still works and is still a bad idea: anyone who can
            # read this Deployment can read the key.
            #
            # `maxConcurrent` on a hosted endpoint is a FLOOR, not a
            # measurement: Ark's real per-account limit is not published here,
            # 64 is what it is known to be at least, and the two local
            # entries stay at 1 because those are single-GPU engines running
            # `--max-running-requests 1`. Raising it is not free — the turn
            # pool is sized to the SUM and its daemon threads are started
            # eagerly (turns.py `_TurnPool`), so this list now spawns 66 at
            # boot. They idle on a queue and cost no CPU; the number is worth
            # knowing before someone adds a fourth hosted model.
            #
            # `context` is WHAT THE PROMPT MAY REACH — not what the engine
            # reports. On these two the difference is the whole point: the
            # local engines serve 62080 and 65536 counting prompt AND
            # generation, so a prompt allowed to fill that leaves nothing to
            # answer with and comes back "prompt is too long: N > 62080".
            # 54000 is the value that has run here for months; 57344 gives
            # mm2 the same ~8K of headroom. Hosted models count input
            # separately, so doubao declares its million.
            #
            # This number is what a session measures itself against for
            # compression (hermes_agent._set_context_window). It used to come
            # from ONE `model.context_length` in the PVC's config.yaml, which
            # hermes treats as an override ahead of every probe — so the
            # value written for dsv4 governed all three endpoints, and a
            # million-token session began summarising at about 19K.
            #
            # `max_tokens` is the other half: what one answer may produce.
            # Neither implies the other. The window also decides which
            # endpoint may seed auxiliary compression (hermes refuses a
            # session whose compression model is under its 32K floor), so an
            # undeclared window is not neutral.
            - name: DEEPWIKI_ENDPOINTS
              value: |
                [{"key":"dsv4","label":"DSV4-Flash","model":"dsv4-flash",
                  "base_url":"http://freetoken-l3:1919/v1","maxConcurrent":1,
                  "context":54000},
                 {"key":"mm2","label":"MiniMax-M2.5","model":"minimax-m25-ftw",
                  "base_url":"http://freetoken-mm2:1919/v1","maxConcurrent":1,
                  "context":57344},
                 {"key":"doubao","label":"Doubao-Seed","model":"doubao-seed-evolving",
                  "base_url":"https://ark.cn-beijing.volces.com/api/v3",
                  "api_key_env":"ARK_API_KEY","maxConcurrent":64,
                  "context":1048576,"max_tokens":131072}]
            # The two model ids are the served names each engine reports on
            # /v1/models (the --model path's basename): dsv4-flash-ftw's pod was
            # later reverted to dsv4-flash, and sglang echoes any requested name
            # back, so the entry matches the SPEC, not the currently running
            # process. mm2 has no such ambiguity. freetoken-mm2.yaml owns the
            # second engine; without that pod this endpoint is offered but
            # errors at send time — the composer only greys on occupancy, not
            # on reachability.
            #
            # `context` is each engine's REAL /v1/models max_model_len, not the
            # checkpoint's nominal one: freetoken sizes the KV pool from the
            # --kv-reserve-tokens flag, and both numbers below are what their
            # engines actually log at boot (62080 for dsv4's MLA; 65536 for
            # mm2 after it moved to the H20 — its 244 KiB/token of MHA KV
            # never fit a 4090: ~2.9 GiB spare = a 4K window, below hermes'
            # ~10K system prompt alone). hermes refuses a session whose
            # auxiliary compression model is under its 32K floor, and with
            # nothing configured that slot defaults to the ACTIVE endpoint's
            # model — so switching to the old 4K mm2 killed every session.
            # The boot seed therefore points auxiliary.compression at the
            # FIRST endpoint declaring >= 32K (here dsv4); mm2 now clears the
            # floor itself, but the seed stays — it is written once and the
            # file owns it after that.
            # The browser toolset's availability check will DOWNLOAD Chromium
            # to decide it is available -- elsewhere a fresh volume grew from
            # 220 KB to 897 MB doing it. These stop that. They are belt to the
            # toolset list's braces: the list below is what removes the browser
            # tools, these keep the availability check from paying for them.
            - { name: HERMES_NO_DEP_INSTALL, value: "1" }
            - { name: HERMES_DISABLE_LAZY_INSTALLS, value: "1" }
            # The name is ACP-era; the ACP path (and the image patch it needed)
            # is gone, and main.py reads this as the first-boot seed below.
            # `mcp-<server>` toolsets are appended after this list, so
            # narrowing it cannot drop retrieval.
            #
            # Toolsets are owned by HERMES_HOME/config.yaml (`platform_toolsets.cli`)
            # from the FIRST boot on: main.py seeds the file from THIS variable
            # only when the key is absent, and never touches it again — edit
            # the file on the PVC, or run `hermes tools`, to change what
            # sessions carry. The built-in default (this env unset AND the file
            # with no key) keeps terminal, so an agent can always run something.
            # MCP toolsets need NOT be listed here: build_agent appends
            # mcp-<name> for every enabled mcp_servers entry.
            #
            # The list is deliberately NARROWER than hermes' own CLI default —
            # which is the full composite (browser, tts, vision, delegation,
            # computer_use…). Absent on purpose:
            #   browser*            no Chromium in this image, and its
            #                       availability check DOWNLOADS one;
            #   delegation          subagents have nowhere to render here;
            #   vision, image_gen, tts, video_gen
            #                       single-purpose tools; the work belongs in
            #                       a skill, and the Wan2.2 backend video_gen
            #                       dispatched to is retired;
            #   the platform integrations (slack/discord/feishu/…) cost tokens
            #   in every request's tool list and none of them are wired up.
            - { name: HERMES_ACP_TOOLSETS, value: "skills" }
            # The toolset POLICY per project (PLAN §5's division of labour):
            #   buda  — skills ONLY. Everything the scripture agent does —
            #           retrieval, corpus reading — a skill initiates, and the
            #           skill calls the MCP (lance-mcp) tools; the agent
            #           itself never sees raw file/terminal surface.
            #           mcp-<name> toolsets are appended by build_agent for
            #           every enabled server, so skills→MCP stays reachable
            #           and this seed cannot drop it.
            #   code  — skills + TERMINAL. The terminal is there for one
            #           reason: `skills/diagram/archify` is a Node CLI, and a
            #           diagram is produced by running it (author JSON,
            #           `validate`, `validate` again, `deliver`), not by
            #           emitting markup. Mermaid was the emitting-markup
            #           answer and it did not survive contact with real
            #           architecture drawings. The trade is stated plainly:
            #           this agent can now run commands in this pod. It reads
            #           its corpus through code-index MCP, so the shell is for
            #           archify and for nothing it needs to reach the code.
            # This env is the FIRST-BOOT seed for platform_toolsets.cli; from
            # then on the file on the PVC owns the list — edit it there.
            # `terminal` is IN the list above — the allowlist was widened once
            # it was six entries and the agent had no way to reach anything
            # this cluster offers. It stays watched, though: with a shell in
            # hand the model takes shortcuts — observed locally reading the
            # corpus with `sed` instead of calling the retrieval server, which
            # also means a local test stops predicting how the pod behaves.
            # To remove it, edit platform_toolsets.cli in the PVC's config.yaml
            # (this env only seeds a file that has no key; it will not put
            # terminal back).
            - { name: WORKDIR, value: /opt/data }
            # The decoupled dependency: HTTP URLs, not spawned processes.
            #
            # ONE variable for every MCP server, as NAME=URL pairs, in order.
            # The first is the one the UI names — the same "first entry wins"
            # rule the endpoint list and the profile list follow. One
            # lance-mcp serves ONE corpus, so a second project's
            # index is a second instance on its own port
            # (k8s/code-index-mcp.yaml), and a profile is then narrowed to
            # the server its corpus lives on plus the tools it uses
            # (`mcp_servers` / `mcp_tools` below).
            #
            # Removing a server here REMOVES it: main.py prunes the config
            # entries this list does not name. It had to be added — the
            # writer only ever added, so a retired server stayed in the file
            # hermes reads and kept handing the agent tools whose server was
            # gone, which fail on use and, three failures in, take the whole
            # MCP connection down with them.
            #
            # `MEMORY_MCP_URL` / `MEMORY_MCP_EXTRA` are the old spelling and
            # still read as a fallback, so a PVC and a manifest that update
            # at different moments do not leave a pod with no retrieval.
            - name: MCP_SERVERS
              value: "lance=http://lance-mcp:5102/mcp,code-index=http://code-index-mcp:5101/mcp"
            - { name: LLM_BASE_URL, value: "http://freetoken-l3:1919/v1" }
            - { name: LLM_MODEL, value: "dsv4-flash" }
            # FreeToken's max_seq_len is 62080 (prompt + generation, derived
            # from what is left of the 4090 after the MoE slot cache), so this
            # leaves ~8k for the reply. Raise it only together with the KV
            # budget on the FreeToken side.
            - { name: LLM_CONTEXT_LENGTH, value: "54000" }
            # What this deployment is for. Read by `hermes_agent.CHAT_DIRECTIVE`
            # and passed as `system_message`, which hermes APPENDS to its own
            # system prompt -- so this steers the agent without displacing its
            # internals, and without appearing in the user's own message the way
            # the retired ACP server's version did. Unset falls back to the same
            # text, which lives beside the code that uses it.
            # Written in English, answered in Chinese, and the second half
            # has to be said out loud: this brief used to BE Chinese, and the
            # language of the answer came along for free with it.
            - name: CHAT_DIRECTIVE
              value: |
                You retrieve from an indexed corpus of Buddhist scripture and answer from what you find.
                - Any question about what a text says: search the corpus first. Do not answer from memory.
                - Cite the sutra and quote the passage, with its source (file › heading path › line numbers).
                - If the corpus does not have it, say so. Background knowledge may be added, marked as not from the corpus.
                - Answer in Chinese, briefly — a few paragraphs. No long essays or survey-style sprawl unless asked.
            # The project cards. Four projects:
            #   buda            — the scripture agent. skills ONLY: everything
            #                     it does a skill initiates, and the skill calls
            #                     the MCP (lance) tools. NO terminal — observed
            #                     in production it reached for sed on the corpus
            #                     instead of calling retrieval; without a shell
            #                     it cannot take that shortcut.
            #   code-autumn-rs  — code understanding for github.com/journeymidnight/
            #                     autumn-rs. skills + the code-index MCP server
            #                     (the tree-sitter index over the pinned
            #                     tarball, k8s/code-index-mcp.yaml) —
            #                     search_code / get_symbol / document_outline.
            #                     NO file tools: a raw file surface lets the
            #                     agent bypass the index; the index IS the
            #                     interface, the same discipline the buda
            #                     profile applies to its corpus. NO workspace:
            #                     this pod deliberately does not mount autumnfs.
            #   general         — the general-purpose agent: hermes' own default
            #                     toolsets, spelled out (terminal, web, search,
            #                     file, todo, memory, skills, session_search,
            #                     clarify) and EVERY MCP server. terminal ⇒
            #                     clarify is enforced by scope_agent_tools
            #                     regardless. No mcp_servers key = no
            #                     narrowing.
            # EVERY PROFILE NEEDS ITS OWN BRIEF. `directive` omitted means the
            # profile inherits CHAT_DIRECTIVE — and CHAT_DIRECTIVE is the
            # BUDDHIST-CANON brief. So the code agent was being told "你是佛教
            # 典籍的检索助手 … 不要凭记忆作答 … 回答时给出经名与原文引文",
            # pointed at a Rust index. Reported as a 画图 request that never
            # arrived: the agent searched fifteen times and never concluded,
            # because its brief forbids answering without a citation it could
            # not possibly find.
            #
            # ⚠ THE CODE BRIEF BELOW REQUIRES A memory-mcp THAT HAS
            # `read_file`, i.e. an autumn-rs image at 49c4ed2 or later. DO NOT
            # apply this profile to a cluster whose code-index-mcp predates
            # it: the brief tells the agent to locate with search_code and
            # then read line ranges, and against the older server that is a
            # call to a tool which does not exist. The currently deployed
            # code-index-mcp is autumn-rs:633a4832, which does NOT have it —
            # that image is pinned by autumn's WIRE lockstep (14 pods share
            # it), and rolling only this one pod forward broke its unpack
            # init container outright.
            #
            # The shape the brief assumes, and why: a search hit is a
            # LOCATION, not a delivery. Hits used to carry each symbol's whole
            # body — 6,563 chars for 8 hits on this index, of which one hit
            # was 17,396 — and trimming that to an excerpt was still the wrong
            # shape, because an excerpt is a smaller delivery the caller must
            # still take. Location-only is 1,712 chars, and reading is then a
            # bounded act the agent performs on purpose.
            #
            # `file` is deliberately NOT in this profile's toolsets. The
            # agent's file tools run in THIS pod, and the corpus (24 MB at
            # /repo/src) lives in the code-index-mcp pod — unpacked there from
            # autumn by an init container. Mounting it here would mean giving
            # this pod the autumn credential and client that its own header
            # says it must never have. read_file serves the tree from the pod
            # that already holds it, and can read nothing else.
            #
            # webui/tool_budget.py stays as the backstop for ANY tool's
            # output, which is a different job from this one.
            #
            # NO ENDPOINT PIN, and the attempt is worth recording. mm2 was
            # pinned here for a shift, on the strength of "mm2 answered this
            # question and dsv4-flash did not". Both halves of that were wrong:
            # dsv4-flash was never allowed to finish (killed at iteration 12,
            # twice, to free the GPU), and mm2 did not win on reasoning — it
            # simply never triggered compression, because its 65,536-token
            # window held what dsv4-flash's 54,000 could not. The real fault
            # was compression timing out; see hermes_config.
            #
            # The pin was also user-hostile in a way measuring did not show:
            # the model picker lists every endpoint (it does not know about
            # profile pins), so choosing DSV4-Flash here would be silently
            # redirected to mm2 and the picker would then snap back — a choice
            # offered and not honoured.
            #
            # `mcp_tools` narrows a GRANTED server to the tools the profile
            # actually uses. lance-mcp publishes more tools than buda needs;
            # buda has business with four: search_docs / list_documents / document_outline to
            # find things, read_file to read around a hit. The other six are a
            # code index it has no corpus for (`search_code`, `get_symbol`,
            # `find_callers`…) and WRITES nobody asked it to make —
            # `ingest_documents` puts new material in the corpus,
            # `graph_delete_node` / `graph_delete_edge` take it out.
            #
            # Cost, beyond the obvious: hermes counts a tool-level error
            # toward its MCP circuit breaker (tools/mcp_tool.py — any result
            # with an `error` key bumps the count), and three in a row
            # declare the server unreachable for 60 s. So a tool that cannot
            # work here does not just sit there costing tokens; used three
            # times it takes search_docs down with it. That is exactly how
            # this profile lost retrieval on 2026-09-19: three read_file
            # calls against ids that could not resolve.
            #
            # buda is the one profile that legitimately inherits
            # CHAT_DIRECTIVE: that brief was written for it.
            - name: DEEPWIKI_PROFILES
              value: |
                [{"key":"buda","label":"佛典检索","toolsets":["skills"],"mcp_servers":["lance"],
                  "mcp_tools":["search_docs","list_documents","document_outline","read_file"]},
                 {"key":"code-autumn-rs","label":"代码理解 · autumn-rs","toolsets":["skills","terminal"],"mcp_servers":["code-index"],
                  "mcp_tools":["search_code","search_docs","read_file","get_symbol","find_callers","find_callees","trace_call_path","list_documents","document_outline"],
                  "directive":"You read the autumn-rs codebase (Rust, distributed storage) and answer from the indexed code.\n\nLocate first, then read closely:\n- search_code tells you WHERE something is — each hit carries file and start/end lines, and no source. It is an index, not content.\n- Read the lines you actually want with read_file(path, start, end); get_symbol returns one whole symbol. Do not search again to obtain text.\n- Follow find_callers / find_callees for call relationships. It beats repeated broad search_code by a wide margin.\n- Read only the range you need. read_file caps at 400 lines per call and reports truncated when it cut the range; ask for further explicit ranges rather than pulling whole files.\n\nOther requirements:\n- Decide what you are looking for before searching, and stop when you have enough. Repeated searching fills the context and leaves the turn unable to finish.\n- Cite file paths and symbol names (and line numbers, where you read them). If the index does not have it, say so rather than guessing.\n- For a flow or architecture diagram: `skill_view(\"archify\")` — that exact name, not the category it sits in — and follow what it says. In short: understand the subject from the index first, rename a skeleton it names rather than inventing coordinates, validate, deliver, and give one /artifacts/ link. Do not search more broadly just to draw, and never paste the HTML or the SVG into the answer.\n- Answer in Chinese, briefly — usually a few paragraphs."},
                 {"key":"general","label":"通用助手","toolsets":["file","terminal","todo","memory","skills","search","web","session_search","clarify"],
                  "directive":"A general assistant. Use tools when they help, say plainly where you are unsure, invent nothing. Answer in Chinese, briefly."}]
            # web_search / web_extract need a backend; the toolset alone is a
            # tool that errors on every call. `web.backend` in config.yaml is
            # empty, and an empty value does NOT mean "off" -- tools/web_tools
            # walks the env for a usable key and, finding none, returns the
            # literal string "firecrawl" for backward compat. So an unconfigured
            # deployment reports a backend it has no key for, and the tool
            # answers with Firecrawl's "log in to Nous Portal" billing notice.
            #
            # This env alone is the whole configuration: TAVILY_API_KEY is the
            # FIRST candidate that walk checks, so nothing needs to be written
            # to the PVC's config.yaml -- and nothing on the PVC can go stale
            # against it either. Tavily because this cluster's egress reaches
            # api.tavily.com; api.search.brave.com and duckduckgo.com both time
            # out from here, which rules out the two no-key backends.
            # `optional: true`: without the secret the toolset degrades to the
            # error it already returns today, rather than blocking startup.
            # Volcengine Ark, for the doubao endpoint above. `optional: true`
            # on purpose: without the secret the endpoint resolves its key to
            # "none" and fails at the provider with something a reader can
            # act on, which beats a pod that will not start and takes the two
            # local models down with it.
            - name: ARK_API_KEY
              valueFrom:
                secretKeyRef: { name: hermes-webui-llm, key: ark-api-key, optional: true }
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef: { name: hermes-webui-web, key: tavily-api-key, optional: true }
            # Single-user HTTP Basic, currently OFF: the `hermes-webui-auth`
            # secret does not exist, `optional: true` leaves both unset, and an
            # empty AUTH_USER bypasses the check on every path. Kept wired so
            # turning it on is `kubectl create secret` plus a restart, not an
            # edit here. The app refuses to start with a user set and an empty
            # password rather than running with a credential that can never
            # match, so a half-created secret fails loudly.
            - name: AUTH_USER
              valueFrom:
                secretKeyRef: { name: hermes-webui-auth, key: user, optional: true }
            - name: AUTH_PASS
              valueFrom:
                secretKeyRef: { name: hermes-webui-auth, key: pass, optional: true }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
          resources:
            requests: { cpu: "200m", memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # /healthz is deliberately shallow — it answers while a turn is
            # running and while `hermes acp` is restarting. A deep probe would
            # restart the pod in exactly the moments this design exists to
            # survive, taking the running turn with it.
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: hermes-webui-data }
---
# Published through the cluster's existing Volcengine APIG instance, the same
# one `dataverse`, `rlinf` and the lerobot console go through. The two
# annotations are what bind an Ingress to that instance; `ingressClassName`
# alone is not enough, and without them the rule is accepted and never served.
#
# PREREQUISITE, and it fails silently: that instance carries a namespace
# allow-list, and `autumn` is not on it —
#
#   APIGInstance/gda7u922gbfvc539oufjg-apig-instance
#     spec.ingress.enableAllNamespaces: false
#     spec.ingress.watchNamespaces:     [dataverse, default, rlinf]
#
# An Ingress outside those namespaces is accepted by the API server, shows up
# in `kubectl get ingress`, and is simply never programmed into the gateway.
# There is no event and no status condition to notice. Add `autumn` to that
# list before expecting this to route:
#
#   kubectl patch apiginstance gda7u922gbfvc539oufjg-apig-instance --type=merge \
#     -p '{"spec":{"ingress":{"watchNamespaces":["dataverse","default","rlinf","autumn"]}}}'
#
# Moving the Ingress into a watched namespace instead does not work: an Ingress
# backend must live in the Ingress's own namespace, so the Service would have to
# move too, and a Service cannot select pods in another namespace.
#
# Deliberately unauthenticated (decided 2026-09-04, reaffirmed 2026-09-14 after
# the scope below widened). The `hermes-webui-auth` secret is not created, so
# AUTH_USER is empty and the app serves every path without a check — see the
# AUTH_USER note further down. The mechanism stays in place: create that secret
# and restart to turn Basic auth on later.
#
# What that means concretely, so nobody has to rediscover it: anyone who can
# reach this host can read every session in the sidebar, start turns against
# FreeToken, and query the corpus. There is no TLS either — the APIG serves this
# rule on port 80.
#
# Re-read that list before assuming it is the same one it was. Tool rows used to
# carry a name and a duration; since the transcript started showing what a tool
# was CALLED with and what it ANSWERED, a reader of `/api/chat/stream` or
# `/api/session/history` also watches `terminal` commands and their output, and
# whatever `file` was pointed at, live. The toolsets are listed above. Nothing
# here is logged server-side, and hermes persisted these results all along — the
# change is who can watch them arrive.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-webui-apig
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
  annotations:
    ingress.vke.volcengine.com/apig-instance-name: gda7u922gbfvc539oufjg-apig-instance
    ingress.vke.volcengine.com/loadbalancer-id: gda7u922gbfvc539oufjg
spec:
  ingressClassName: physicalai-apig
  rules:
    - host: deepwiki.apig.local
      http:
        paths:
          # One backend, one prefix. The SSE stream is a plain GET on this same
          # port; nothing here may buffer it, which is why the app sends
          # `X-Accel-Buffering: no` on that response.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-webui
                port: { number: 8080 }
