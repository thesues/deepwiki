# Replace both image placeholders before applying. IMAGE_AUTUMN_RS must be the
# image currently running the Autumn cluster: it runs the autumn-s3 GATEWAY
# deployment (k8s/autumn-s3.yaml), it no longer contributes a fuse binary —
# this pod has no FUSE mount, no privileged container and no fs/ credential.
# Community LanceDB itself is entirely inside IMAGE_LANCE_MCP.
#
# Storage: LanceDB opens `s3://lancedb/buda` against the gateway. That is the
# SAME object set the old FUSE-mount deployment wrote (`/mnt/autumn/lancedb`
# = `fs/lancedb`), so a table written by either deployment is read by the
# other without re-ingesting; the gateway marker `lancedb/.buda-docs-v1-ready`
# decides, exactly as the old filesystem marker did.
---
apiVersion: v1
kind: Service
metadata:
  name: lance-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: lance-mcp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: lance-mcp }
  ports:
    - { name: http, port: 5102, targetPort: 5102 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lance-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: lance-mcp }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: lance-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: lance-mcp }
    spec:
      enableServiceLinks: false
      nodeSelector: { autumn-node: "true" }
      containers:
        - name: lance-mcp
          image: IMAGE_LANCE_MCP
          imagePullPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              S3="http://$(getent hosts autumn-s3 | awk '{print $1}'):9100"
              DB="s3://lancedb/buda"

              # The Rust client behind the gateway is IP-only; resolve first.
              # HEAD (marker check) answers fast once the gateway is up; before
              # that the request fails and we retry. The list with limit=1 is
              # the cheapest request that proves the gateway serves objects.
              for i in $(seq 1 120); do
                if .venv/bin/python -c "from s3 import Gateway; from s3 import S3Error; Gateway('$S3').list('lancedb', 'buda', limit=1)" 2>/dev/null; then break; fi
                sleep 1
              done
              .venv/bin/python -c "from s3 import Gateway; Gateway('$S3').list('lancedb', 'buda', limit=1)" \
                || { echo "gateway not serving after 120s"; exit 1; }

              # --ensure: skipped when the marker object exists (no re-ingest —
              # the table is already there), written LAST after a successful
              # ingest so a replacement overwrites tables left by an
              # interrupted initial ingest.
              .venv/bin/python ingest_docs.py \
                --s3-endpoint "$S3" --index docs/buda --db-path "$DB" \
                --embed-url http://llama-embed:8080 --embed-model bge-m3 \
                --marker s3://lancedb/.buda-docs-v1-ready --ensure

              .venv/bin/python server.py \
                --db-path "$DB" --s3-endpoint "$S3" \
                --embed-url http://llama-embed:8080 --embed-model bge-m3 \
                --host 0.0.0.0 --port 5102
          ports:
            - { name: http, containerPort: 5102 }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { cpu: "4", memory: 8Gi }
          startupProbe:
            httpGet: { path: /healthz, port: 5102 }
            periodSeconds: 15
            failureThreshold: 180
          readinessProbe:
            httpGet: { path: /healthz, port: 5102 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 5102 }
            periodSeconds: 30
            failureThreshold: 3
