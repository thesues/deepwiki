# code-index-mcp — memory-mcp over a CODE repo, the second corpus.
#
# The buda corpus lives in `fs/docs/buda/` and is served by the `memory-mcp`
# deployment (k8s/memory-mcp.yaml) on :5100. A code repo needs its own
# instance: one memory-mcp serves ONE store (its --root / --docs), and the
# index it builds is keyed by tenant/agent — mixing a scripture corpus and a
# source tree in one agent would pollute both corpora's BM25 statistics.
#
# Corpus: github.com/journeymidnight/autumn-rs, cloned --depth 1, tarred, and
# uploaded to `fs/code/autumn-rs.tar.gz` (7.7 MB, 24 lanes). The tarball — not
# a live clone — is deliberate:
#   * the pod image carries no git, and adding it to the autumn-rs image for
#     one init step bloats every other consumer of that image;
#   * a pinned tarball is reproducible: the index is built from exactly the
#     commit the tar holds, and re-indexing a newer upstream is a re-upload,
#     not a silent drift on some pod restart;
#   * egress from this cluster to github is not a thing to bet a startup on.
#
# The tarball is the SHIPPING format; `fs/code/autumn-rs/` is where the corpus
# lives. This pod unpacks the one into the other on first boot and indexes it
# where it lands — memory-mcp only takes autumnfs directories now, which is
# the whole point of the example: put the files in the storage, then index
# them there. It also means this pod no longer keeps a second copy of the tree
# in an emptyDir, and the ids it stores (`code/autumn-rs/crates/...`) say
# where the file is in the filesystem rather than where some container
# mounted it.
#
# The code indexer (tree-sitter) speaks RUST only — `indexer.rs` hardcodes
# `tree_sitter_rust`. That is exactly right for this repo; a Python repo would
# get the prose ingest alone (drop `--code`).
#
# Prose rides along: one `--index` tree is walked for BOTH symbols and
# markdown, so ops.md and CLAUDE.md are searchable through search_docs while
# symbols go through search_code. Wider than the old `--docs /repo/src/docs`:
# every .md under the repo is ingested now, not just the docs/ subtree.
---
apiVersion: v1
kind: Service
metadata:
  name: code-index-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: code-index-mcp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: code-index-mcp }
  ports:
    - { name: http, port: 5101, targetPort: 5101 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-index-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: code-index-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: code-index-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: code-index-mcp }
    spec:
      enableServiceLinks: false
      nodeSelector: { autumn-node: "true" }

      # No initContainer any more: the unpack has to happen INSIDE the fuse
      # mount, and an init container cannot see this container's mount
      # namespace (propagation does not work on this cluster — see the long
      # note in k8s/memory-mcp.yaml). Same reason the mount is not a sidecar.
      containers:
        - name: code-index-mcp
          image: IMAGE_AUTUMN_RS
          securityContext: { privileged: true }
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              M="$(getent hosts autumn-manager | awk '{print $1}'):9001"
              MP=/mnt/autumn
              mkdir -p "$MP"

              # Every line of this mount block is load-bearing and every one
              # of them is explained in k8s/memory-mcp.yaml — stale mount
              # cleared through /proc/mounts rather than stat, --direct-read
              # false so reads over 64 KiB survive EC-converted extents, and a
              # wait that ends on a real READ because the kernel publishes the
              # mount entry before FUSE INIT completes.
              if grep -qs " $MP fuse" /proc/mounts; then
                fusermount3 -uz "$MP" 2>/dev/null || umount -l "$MP" 2>/dev/null || true
              fi
              autumn-fuse --manager "$M" --mountpoint "$MP" --transport tcp --direct-read false \
                --credential-file /etc/autumn/cred/fs.cred &
              FUSE_PID=$!
              trap 'kill $FUSE_PID 2>/dev/null; fusermount3 -u "$MP" 2>/dev/null' EXIT

              # `docs` is a directory that exists in the FILESYSTEM and cannot
              # exist before it is serving — the corpus this pod wants may not
              # be there yet on a first boot, so it cannot be the liveness
              # proof the buda pod uses.
              for i in $(seq 1 120); do
                ls "$MP/docs" >/dev/null 2>&1 && break
                kill -0 $FUSE_PID 2>/dev/null || { echo "autumn-fuse exited during mount"; exit 1; }
                sleep 1
              done
              ls "$MP/docs" >/dev/null 2>&1 || { echo "mount not serving after 120s"; exit 1; }

              # Unpack the pinned tarball INTO the filesystem, once. The
              # corpus then lives in autumn like everything else, and this pod
              # keeps no second copy: a restart finds the tree already there
              # and goes straight to serving. Re-uploading a newer tarball is
              # `rm -rf` here plus a restart, which is the deliberate step it
              # should be.
              SRC="$MP/code/autumn-rs"
              if [ ! -d "$SRC" ]; then
                echo "corpus not in autumnfs yet; unpacking the pinned tarball"
                autumnfs --manager "$M" --credential-file /etc/autumn/cred/fs.cred --transport tcp \
                  get /code/autumn-rs.tar.gz /tmp/autumn-rs.tar.gz
                mkdir -p "$SRC"
                tar xzf /tmp/autumn-rs.tar.gz -C "$SRC"
                rm /tmp/autumn-rs.tar.gz
              fi
              echo "corpus:"; ls "$SRC" | head -5

              # --index takes the autumnfs path; --fs-root is the only place
              # the mountpoint is named, and it stays out of every stored id.
              # --code adds the tree-sitter pass on top of the prose ingest.
              #
              # `--reset` was on for the one roll that moved the ids from
              # `src/...` (relative to an emptyDir that no longer exists) to
              # `code/autumn-rs/...`. It rebuilt 5698 symbols / 67415 edges
              # from 514 files in 2m23s — which is exactly what it would cost
              # on EVERY restart if it were left on, since an existing index
              # is otherwise served as-is (`--reindex` forces one deliberately).
              exec memory-mcp "$M" \
                --index code/autumn-rs \
                --fs-root "$MP" \
                --code \
                --tenant code \
                --agent autumn-rs \
                --embed-url http://llama-embed:8080 \
                --embed-model bge-m3 \
                --credential-file /etc/autumn/cred/mem.cred \
                --host 0.0.0.0 --port 5101
          ports:
            - { name: http, containerPort: 5101 }
          volumeMounts:
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "4", memory: 8Gi }
          startupProbe:
            # First boot indexes the whole tree (tree-sitter over ~200 .rs
            # files + BGE-M3 embeddings for every symbol) before the listener
            # binds. Generous for the same reason memory-mcp's is: too small
            # costs an infinite restart loop, too large costs one slow failure.
            #
            # Raised from 30 min when the corpus moved into autumnfs: the very
            # first boot also unpacks ~90 MB / a few thousand files INTO the
            # filesystem, and every one of those is inode + extent work over
            # the network rather than a local write. That cost is paid once —
            # later restarts find the tree already there — but the budget has
            # to cover the boot that pays it.
            httpGet: { path: /config, port: 5101 }
            periodSeconds: 15
            failureThreshold: 240     # 240 x 15s = 60 min
          readinessProbe:
            httpGet: { path: /config, port: 5101 }
            periodSeconds: 15

      volumes:
        - name: cred
          secret: { secretName: autumn-credential }
